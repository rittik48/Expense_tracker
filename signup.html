<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Expense Tracker</title><link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <a class="brand centered" href="index.html">💰 Expense<span>Tracker</span></a>
    <h1>Create account</h1><p class="muted">Start organizing your finances today.</p>
    <div id="signupAlert" class="alert hidden"></div>
    <form id="signupForm">
      <label>Full Name<input id="name" required placeholder="Your name"></label>
      <label>Email<input id="email" type="email" required placeholder="you@example.com"></label>
      <label>Password<input id="password" type="password" minlength="6" required placeholder="Minimum 6 characters"></label>
      <label>Confirm Password<input id="confirm" type="password" minlength="6" required placeholder="Repeat password"></label>
      <button class="btn btn-primary full" type="submit">Create Account</button>
    </form>
    <p class="auth-footer">Already registered? <a href="login.html">Login</a></p>
    <a href="index.html" class="back-link">← Back to home</a>
  </div>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("signupForm").addEventListener("submit", function(e){
      e.preventDefault();
      const a = document.getElementById("password").value;
      const b = document.getElementById("confirm").value;
      const alertBox = document.getElementById("signupAlert");
      if(a !== b){ alertBox.className="alert error"; alertBox.textContent="Passwords do not match."; return; }
      const result = signupUser(document.getElementById("name").value.trim(), document.getElementById("email").value.trim(), a);
      alertBox.className = "alert " + (result.ok ? "success" : "error");
      alertBox.textContent = result.message;
      if(result.ok) setTimeout(() => location.href="login.html", 700);
    });
  </script>
</body>
</html>

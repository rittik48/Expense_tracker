<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Expenses | Expense Tracker</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html">💰 Expense<span>Tracker</span></a><nav class="side-nav"><a href="dashboard.html">▣ Dashboard</a><a href="add-expense.html">＋ Add Expense</a><a class="active" href="expenses.html">☷ My Expenses</a><a href="budget.html">◎ Budget</a><a href="reports.html">◔ Reports</a></nav><div class="sidebar-bottom"><a href="#" onclick="logout();return false;">↪ Logout</a></div></aside>
<main class="main"><div class="topbar"><div class="page-title"><h1>My Expenses</h1><p>View, search and manage your transactions.</p></div><a href="add-expense.html" class="btn btn-primary">＋ Add Expense</a></div>
<div class="panel"><div class="toolbar"><input id="search" placeholder="Search category or description..."><select id="filter"><option value="all">All categories</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Education</option><option>Healthcare</option><option>Entertainment</option><option>Recharge</option><option>Others</option></select></div><br><div class="table-wrap"><table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Payment</th><th>Amount</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div>
<script src="../js/auth.js"></script><script src="../js/app.js"></script><script>
const user=requireRole("user");function render(){let q=document.getElementById("search").value.toLowerCase(),f=document.getElementById("filter").value;let arr=userExpenses(user.id).filter(e=>(f==="all"||e.category===f)&&((e.category+" "+e.description).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById("rows").innerHTML=arr.length?arr.map(e=>`<tr><td>${e.date}</td><td><span class="badge">${escapeHtml(e.category)}</span></td><td>${escapeHtml(e.description||"-")}</td><td>${escapeHtml(e.payment)}</td><td><b>${money(e.amount)}</b></td><td><button class="btn btn-danger" onclick="removeIt('${e.id}')">Delete</button></td></tr>`).join(""):`<tr><td colspan="6"><div class="empty">No matching expenses.</div></td></tr>`}function removeIt(id){if(confirm("Delete this expense?")){deleteExpense(id);render()}}document.getElementById("search").addEventListener("input",render);document.getElementById("filter").addEventListener("change",render);render();
</script></body></html>

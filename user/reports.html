<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reports | Expense Tracker</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html">💰 Expense<span>Tracker</span></a><nav class="side-nav"><a href="dashboard.html">▣ Dashboard</a><a href="add-expense.html">＋ Add Expense</a><a href="expenses.html">☷ My Expenses</a><a href="budget.html">◎ Budget</a><a class="active" href="reports.html">◔ Reports</a></nav><div class="sidebar-bottom"><a href="#" onclick="logout();return false;">↪ Logout</a></div></aside>
<main class="main"><div class="topbar"><div class="page-title"><h1>Reports & Insights</h1><p>Understand where your money goes.</p></div></div>
<div class="cards"><div class="stat-card"><div class="stat-label">TOTAL SPENDING</div><div class="stat-value" id="total">₹0</div></div><div class="stat-card"><div class="stat-label">TOP CATEGORY</div><div class="stat-value" id="top">—</div></div><div class="stat-card"><div class="stat-label">AVG. TRANSACTION</div><div class="stat-value" id="avg">₹0</div></div><div class="stat-card"><div class="stat-label">TRANSACTIONS</div><div class="stat-value" id="count">0</div></div></div>
<div class="dashboard-grid"><div class="panel"><div class="panel-header"><h2>Category Breakdown</h2></div><div id="bars" class="bar-list"></div></div><div class="panel"><div class="panel-header"><h2>Monthly Spending</h2></div><div id="monthly" class="chart-bars"></div></div></div></main></div>
<script src="../js/auth.js"></script><script src="../js/app.js"></script><script>
const user=requireRole("user"), arr=userExpenses(user.id), total=totalExpenses(arr);document.getElementById("total").textContent=money(total);document.getElementById("count").textContent=arr.length;document.getElementById("avg").textContent=money(arr.length?total/arr.length:0);
const cats={};arr.forEach(e=>cats[e.category]=(cats[e.category]||0)+e.amount);const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]);document.getElementById("top").textContent=sorted[0]?.[0]||"—";const max=Math.max(...Object.values(cats),1);document.getElementById("bars").innerHTML=sorted.map(([k,v])=>`<div class="bar-row"><span>${escapeHtml(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%"></div></div><b>${money(v)}</b></div>`).join("")||`<div class="empty">Add expenses to generate insights.</div>`;
const months={};arr.forEach(e=>{let m=e.date.slice(0,7);months[m]=(months[m]||0)+e.amount});const ms=Object.entries(months).sort((a,b)=>a[0].localeCompare(b[0])).slice(-7),mm=Math.max(...ms.map(x=>x[1]),1);document.getElementById("monthly").innerHTML=ms.map(([m,v])=>`<div class="chart-col"><b style="font-size:10px">${money(v)}</b><div class="bar" style="height:${Math.max(v/mm*170,3)}px"></div><span>${m}</span></div>`).join("")||`<div class="empty">No monthly data.</div>`;
</script></body></html>

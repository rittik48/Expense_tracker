<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Budget | Expense Tracker</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html">💰 Expense<span>Tracker</span></a><nav class="side-nav"><a href="dashboard.html">▣ Dashboard</a><a href="add-expense.html">＋ Add Expense</a><a href="expenses.html">☷ My Expenses</a><a class="active" href="budget.html">◎ Budget</a><a href="reports.html">◔ Reports</a></nav><div class="sidebar-bottom"><a href="#" onclick="logout();return false;">↪ Logout</a></div></aside>
<main class="main"><div class="topbar"><div class="page-title"><h1>Monthly Budget</h1><p>Set a spending limit and stay disciplined.</p></div></div>
<div class="dashboard-grid"><div class="panel"><h2>Set Budget</h2><p class="muted">Your budget applies to the current month.</p><form id="budgetForm"><label>Monthly Budget (₹)<input id="budgetInput" type="number" min="0" step="100" required placeholder="20000"></label><button class="btn btn-primary" type="submit">Save Budget</button></form><div id="alert" class="alert hidden"></div></div>
<div class="panel"><h2>Budget Status</h2><div class="budget-box"><div class="budget-number" id="total">₹0</div><p class="muted">spent this month</p><div class="progress"><div id="progress"></div></div><div class="kpi"><span>Budget</span><b id="b">₹0</b></div><div class="kpi"><span>Spent</span><b id="s">₹0</b></div><div class="kpi"><span>Remaining</span><b id="r">₹0</b></div></div></div></div></main></div>
<script src="../js/auth.js"></script><script src="../js/app.js"></script><script>
const user=requireRole("user");function render(){let budgets=getBudgets(),b=Number(budgets[user.id]||0),s=totalExpenses(monthExpenses(user.id));document.getElementById("budgetInput").value=b||"";document.getElementById("total").textContent=money(s);document.getElementById("b").textContent=money(b);document.getElementById("s").textContent=money(s);let r=b-s;document.getElementById("r").textContent=money(r);document.getElementById("r").className=r<0?"danger-text":"success-text";document.getElementById("progress").style.width=(b?Math.min(s/b*100,100):0)+"%"}document.getElementById("budgetForm").addEventListener("submit",e=>{e.preventDefault();let x=getBudgets();x[user.id]=Number(document.getElementById("budgetInput").value);saveBudgets(x);let a=document.getElementById("alert");a.className="alert success";a.textContent="Budget saved successfully.";render()});render();
</script></body></html>

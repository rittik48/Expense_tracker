<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Add Expense | Expense Tracker</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html">💰 Expense<span>Tracker</span></a><nav class="side-nav"><a href="dashboard.html">▣ Dashboard</a><a class="active" href="add-expense.html">＋ Add Expense</a><a href="expenses.html">☷ My Expenses</a><a href="budget.html">◎ Budget</a><a href="reports.html">◔ Reports</a></nav><div class="sidebar-bottom"><a href="#" onclick="logout();return false;">↪ Logout</a></div></aside>
<main class="main"><div class="topbar"><div class="page-title"><h1>Add Expense</h1><p>Record a new transaction.</p></div></div>
<div class="panel" style="max-width:850px"><div id="alert" class="alert hidden"></div><form id="expenseForm"><div class="form-grid">
<label>Amount (₹)<input id="amount" type="number" min="0.01" step="0.01" required placeholder="500"></label>
<label>Date<input id="date" type="date" required></label>
<label>Category<select id="category" required><option value="">Select category</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Education</option><option>Healthcare</option><option>Entertainment</option><option>Recharge</option><option>Others</option></select></label>
<label>Payment Method<select id="payment" required><option>UPI</option><option>Cash</option><option>Debit Card</option><option>Credit Card</option><option>Bank Transfer</option></select></label>
<label class="full-col">Description<textarea id="description" rows="4" placeholder="What was this expense for?"></textarea></label>
<div class="full-col"><button class="btn btn-primary" type="submit">Save Expense</button> <a class="btn btn-outline" href="expenses.html">Cancel</a></div>
</div></form></div></main></div>
<script src="../js/auth.js"></script><script src="../js/app.js"></script><script>
const user=requireRole("user");document.getElementById("date").value=new Date().toISOString().slice(0,10);
document.getElementById("expenseForm").addEventListener("submit",e=>{e.preventDefault();addExpense(user.id,{amount:document.getElementById("amount").value,date:document.getElementById("date").value,category:document.getElementById("category").value,payment:document.getElementById("payment").value,description:document.getElementById("description").value.trim()});const a=document.getElementById("alert");a.className="alert success";a.textContent="Expense saved successfully.";e.target.reset();document.getElementById("date").value=new Date().toISOString().slice(0,10);});
</script></body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>User Management | Expense Tracker</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html">💰 Expense<span>Tracker</span></a><nav class="side-nav"><a href="dashboard.html">▣ Dashboard</a><a class="active" href="users.html">♙ Users</a><a href="expenses.html">☷ All Expenses</a><a href="reports.html">◔ Reports</a></nav><div class="sidebar-bottom"><a href="#" onclick="logout();return false;">↪ Logout</a></div></aside><main class="main"><div class="topbar"><div class="page-title"><h1>User Management</h1><p>View and manage registered users.</p></div></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search users..."></div><br><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Registered</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div>
<script src="../js/auth.js"></script><script src="../js/app.js"></script><script>
requireRole("admin");function render(){let q=document.getElementById("search").value.toLowerCase(),arr=getUsers().filter(u=>u.name.toLowerCase().includes(q)||u.email.toLowerCase().includes(q));document.getElementById("rows").innerHTML=arr.map(u=>`<tr><td><b>${escapeHtml(u.name)}</b></td><td>${escapeHtml(u.email)}</td><td><span class="badge">${u.role}</span></td><td>${u.id.startsWith("u-")?new Date(Number(u.id.slice(2))).toLocaleDateString("en-IN"):"Demo"}</td><td>${u.role==="user"?`<button class="btn btn-danger" onclick="removeUser('${u.id}')">Delete</button>`:"Protected"}</td></tr>`).join("")}function removeUser(id){if(!confirm("Delete this user and their expenses?"))return;saveUsers(getUsers().filter(u=>u.id!==id));saveExpenses(getExpenses().filter(e=>e.userId!==id));render()}document.getElementById("search").addEventListener("input",render);render();
</script></body></html>

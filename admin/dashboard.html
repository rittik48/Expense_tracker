<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard | Expense Tracker</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html">💰 Expense<span>Tracker</span></a><nav class="side-nav"><a class="active" href="dashboard.html">▣ Dashboard</a><a href="users.html">♙ Users</a><a href="expenses.html">☷ All Expenses</a><a href="reports.html">◔ Reports</a></nav><div class="sidebar-bottom"><a href="#" onclick="logout();return false;">↪ Logout</a></div></aside>
<main class="main"><div class="topbar"><div class="page-title"><h1>Admin Dashboard</h1><p>Monitor the Expense Tracker system.</p></div><div class="profile"><div><b id="adminName"></b><small class="muted"> Administrator</small></div><div class="avatar">A</div></div></div>
<section class="cards"><div class="stat-card"><div class="stat-label">REGISTERED USERS</div><div class="stat-value" id="users">0</div></div><div class="stat-card"><div class="stat-label">TOTAL EXPENSES</div><div class="stat-value" id="expense">₹0</div></div><div class="stat-card"><div class="stat-label">TRANSACTIONS</div><div class="stat-value" id="transactions">0</div></div><div class="stat-card"><div class="stat-label">CATEGORIES USED</div><div class="stat-value" id="categories">0</div></div></section>
<section class="dashboard-grid"><div class="panel"><div class="panel-header"><h2>Recent Transactions</h2><a class="btn btn-outline" href="expenses.html">View all</a></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Date</th><th>Category</th><th>Amount</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="panel"><div class="panel-header"><h2>System Summary</h2></div><div id="summary"></div></div></section>
</main></div><script src="../js/auth.js"></script><script src="../js/app.js"></script><script>
const user=requireRole("admin");if(user){document.getElementById("adminName").textContent=user.name;const users=getUsers(),ex=getExpenses();document.getElementById("users").textContent=users.filter(u=>u.role==="user").length;document.getElementById("expense").textContent=money(totalExpenses(ex));document.getElementById("transactions").textContent=ex.length;document.getElementById("categories").textContent=new Set(ex.map(e=>e.category)).size;const names=Object.fromEntries(users.map(u=>[u.id,u.name]));const recent=[...ex].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);document.getElementById("rows").innerHTML=recent.length?recent.map(e=>`<tr><td>${escapeHtml(names[e.userId]||"Unknown")}</td><td>${e.date}</td><td><span class="badge">${escapeHtml(e.category)}</span></td><td><b>${money(e.amount)}</b></td></tr>`).join(""):`<tr><td colspan="4"><div class="empty">No transactions yet.</div></td></tr>`;const byUser={};ex.forEach(e=>byUser[e.userId]=(byUser[e.userId]||0)+e.amount);document.getElementById("summary").innerHTML=`<div class="kpi"><span>Active user accounts</span><b>${users.filter(u=>u.role==="user").length}</b></div><div class="kpi"><span>Total recorded spending</span><b>${money(totalExpenses(ex))}</b></div><div class="kpi"><span>Average transaction</span><b>${money(ex.length?totalExpenses(ex)/ex.length:0)}</b></div><div class="kpi"><span>Users with transactions</span><b>${Object.keys(byUser).length}</b></div>`}
</script></body></html>

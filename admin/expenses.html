<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>All Expenses | Expense Tracker</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="dashboard.html">💰 Expense<span>Tracker</span></a><nav class="side-nav"><a href="dashboard.html">▣ Dashboard</a><a href="users.html">♙ Users</a><a class="active" href="expenses.html">☷ All Expenses</a><a href="reports.html">◔ Reports</a></nav><div class="sidebar-bottom"><a href="#" onclick="logout();return false;">↪ Logout</a></div></aside><main class="main"><div class="topbar"><div class="page-title"><h1>All Expenses</h1><p>System-wide transaction monitoring.</p></div></div><div class="panel"><div class="toolbar"><input id="search" placeholder="Search user/category..."><select id="filter"><option value="all">All categories</option><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Education</option><option>Healthcare</option><option>Entertainment</option><option>Recharge</option><option>Others</option></select></div><br><div class="table-wrap"><table><thead><tr><th>User</th><th>Date</th><th>Category</th><th>Payment</th><th>Description</th><th>Amount</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></main></div>
<script src="../js/auth.js"></script><script src="../js/app.js"></script><script>
requireRole("admin");function render(){const users=getUsers(),names=Object.fromEntries(users.map(u=>[u.id,u.name])),q=document.getElementById("search").value.toLowerCase(),f=document.getElementById("filter").value;let arr=getExpenses().filter(e=>(f==="all"||e.category===f)&&((names[e.userId]||"").toLowerCase()+" "+e.category+" "+(e.description||"")).includes(q)).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById("rows").innerHTML=arr.length?arr.map(e=>`<tr><td>${escapeHtml(names[e.userId]||"Unknown")}</td><td>${e.date}</td><td><span class="badge">${escapeHtml(e.category)}</span></td><td>${escapeHtml(e.payment)}</td><td>${escapeHtml(e.description||"-")}</td><td><b>${money(e.amount)}</b></td><td><button class="btn btn-danger" onclick="removeIt('${e.id}')">Delete</button></td></tr>`).join(""):`<tr><td colspan="7"><div class="empty">No expenses found.</div></td></tr>`}function removeIt(id){if(confirm("Delete this expense?")){deleteExpense(id);render()}}document.getElementById("search").addEventListener("input",render);document.getElementById("filter").addEventListener("change",render);render();
</script></body></html>
